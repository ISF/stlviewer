<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stlviewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #181c22;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: #c8ccd2;
      }
      #app { width: 100vw; height: 100vh; display: block; }

      .overlay {
        position: fixed;
        pointer-events: none;
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #hint {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        opacity: 0.7;
      }
      #hint kbd {
        display: inline-block;
        padding: 1px 6px;
        margin: 0 2px;
        border: 1px solid #3a4250;
        border-radius: 4px;
        background: #232831;
        font-family: -apple-system, BlinkMacSystemFont, monospace;
        font-size: 12px;
      }
      #status {
        bottom: 8px;
        left: 12px;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      #status.error { color: #ff7a7a; }
      #status.watching::before {
        content: "● ";
        color: #4caf50;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hint" class="overlay">
      Drop a <code>.stl</code> file here, or press <kbd>⌘</kbd>+<kbd>O</kbd> to open
    </div>
    <div id="status" class="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
